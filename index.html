


<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificare bilete - Balul Bobocilor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      width: 85%;
      max-width: 400px;
      box-shadow: 0 4px 20px #0002;
    }

    h1 {
      font-size: 25px;
    }

    #status {
      font-size: 30px;
      font-weight: bold;
      margin-top: 20px;
    }

    .valid {
      color: #16803c;
    }

    .invalid {
      color: #c62828;
    }

    #number {
      color: #555;
      white-space: pre-line;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>🎟️ Balul Bobocilor</h1>
    <p id="number"></p>
    <div id="status">Se verifică...</div>
  </main>

  <script>
    // AICI ADAUGI NUMELE CUMPARATORILOR
    const numeParticipanti = {
      "BB001": "Bobeică Daniela Ana-Maria",
      "BB002": "Lăzărescu Briana",
      "BB003": "Voica Alina",
      "BB004": "Șerb Talida",
      "BB005": "Șerb Liliana",
      "BB006": "Șerb Marian"
    };

    // Toate cele 300 de bilete
    const bileteValide = Array.from(
      { length: 300 },
      (_, i) => "BB" + String(i + 1).padStart(3, "0")
    );

    // Citim codul din linkul QR
    const params = new URLSearchParams(window.location.search);
    const cod = (params.get("ticket") || "").trim().toUpperCase();

    const number = document.getElementById("number");
    const status = document.getElementById("status");

    if (cod) {
      number.textContent =
        "Bilet: " + cod + "\n" +
        "Nume: " +
        (numeParticipanti[cod] || "Numele nu a fost adăugat încă.");
    } else {
      number.textContent = "Nu a fost furnizat un cod.";
    }

    if (bileteValide.includes(cod)) {
      status.textContent = "BILET VALID";
      status.className = "valid";
    } else {
      status.textContent = "BILET INVALID";
      status.className = "invalid";
    }
  </script>
</body>
</html>
